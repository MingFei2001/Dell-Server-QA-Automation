services:
  idrac-day0-staging:
    build: .
    container_name: idrac-day0-staging
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  files:
    image: copyparty/min:1.20.27
    container_name: idrac-day0-files
    user: "1000:1000"
    ports:
      - "${FILES_PORT:-3923}:3923"
    volumes:
      - ./data:/w:ro
      - ./files.conf:/cfg/files.conf:ro
    restart: unless-stopped
